patch:
  "style/color_scheme": local_semantic
  "style/font_face": "Microsoft JhengHei UI"
  "style/label_font_face": "Segoe UI"
  "style/comment_font_face": "Microsoft JhengHei UI"
  "style/font_point": 12
  "style/label_font_point": 10
  "style/comment_font_point": 10
  "style/horizontal": true
  "style/inline_preedit": true
  "style/antialias_mode": grayscale
  "style/label_format": "%s"
  "style/hover_type": none
  "show_notifications": [ascii_mode, local_ai]
  "show_notifications_time": 1400
  "style/display_tray_icon": true
  "style/layout/border_width": 1
  "style/layout/margin_x": 8
  "style/layout/margin_y": 6
  "style/layout/spacing": 6
  "style/layout/candidate_spacing": 10
  "style/layout/hilite_spacing": 4
  "style/layout/hilite_padding": 4
  "style/layout/round_corner": 4
  "style/layout/corner_radius": 6
  "style/layout/shadow_radius": 0
  "style/layout/min_width": 0
  "style/layout/max_width": 640
  "preset_color_schemes/local_semantic":
    name: "本地語意"
    # Weasel colors use BGR. The cyan selection follows the supplied reference.
    back_color: 0xF7F6F5
    border_color: 0xDDDAD8
    text_color: 0x2B2724
    candidate_text_color: 0x2B2724
    label_color: 0x72675E
    comment_text_color: 0x72675E
    hilited_text_color: 0x2B2724
    hilited_back_color: 0xF4ECC4
    hilited_candidate_text_color: 0x2B2724
    hilited_candidate_back_color: 0xF4ECC4
    hilited_label_color: 0x584A36
    hilited_comment_text_color: 0x584A36
